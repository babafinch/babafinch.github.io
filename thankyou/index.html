  <script>
    function selectDefaultTheme() {
      const configuredTheme = "auto";

      if (configuredTheme === "auto") {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
      }
      return configuredTheme;
    }

    const defaultTheme = selectDefaultTheme();
    const isToggleEnabled = true;
    const userTheme = false;

    function setTheme(mode) {
      if (mode === "dark") {
        document.documentElement.setAttribute("dark", "");
        document.documentElement.classList.add("dark-mode");
      } else if (mode === "light") {
        document.documentElement.removeAttribute("dark");
        document.documentElement.classList.remove("dark-mode");
      }
    }

    if (isToggleEnabled) {
      if (userTheme) {
        setTheme(userTheme);
      } else {
        setTheme(defaultTheme);
      }
    } else {
      setTheme(defaultTheme);
    }

    if (localStorage.getItem("classView") === "list") {
      document.documentElement.setAttribute("list", "");
      document.documentElement.classList.add('view-list');
    }
  </script>
